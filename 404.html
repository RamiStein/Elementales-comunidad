<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elementales | Red Comunitaria</title>
  <script>
    (function() {
      // Enrutador inteligente instantáneo para GitHub Pages y URLs limpias (/nodo/..., /circulo/..., /lomaverde, etc.)
      var fullPath = (window.location.pathname || '').replace(/^\/+|\/+$/g, '');
      var search = window.location.search || '';
      var hash = window.location.hash || '';

      var parts = fullPath.split('/');
      var first = (parts[0] || '').toLowerCase();
      var second = (parts[1] || '').toLowerCase();

      // Rutas con prefijo /nodo/{slug}
      if (first === 'nodo' && second) {
        var queryJoin = search ? '&' + search.replace(/^\?/, '') : '';
        if (second === 'lomaverde' || second === 'nodo-lomaverde') {
          localStorage.setItem('elementales_active_node', 'nodo-lomaverde');
          window.location.replace('/?nodo=lomaverde' + queryJoin + (hash || ''));
        } else if (second === 'lucila' || second === 'nodo-lucila') {
          localStorage.setItem('elementales_active_node', 'nodo-lucila');
          window.location.replace('/?nodo=lucila' + queryJoin + (hash || ''));
        } else if (second === 'cooperativa' || second === 'chasqui' || second === 'nodo-cooperativa') {
          localStorage.setItem('elementales_active_node', 'nodo-cooperativa');
          window.location.replace('/?nodo=cooperativa' + queryJoin + (hash || ''));
        } else {
          localStorage.setItem('elementales_active_node', 'nodo-' + second);
          window.location.replace('/?nodo=' + encodeURIComponent(second) + queryJoin + (hash || ''));
        }
        return;
      }

      // Rutas con prefijo /circulo/{slug}
      if (first === 'circulo' && second) {
        var queryJoin = search ? '&' + search.replace(/^\?/, '') : '';
        window.location.replace('/?c=' + encodeURIComponent(second) + queryJoin + (hash || ''));
        return;
      }

      // Compatibilidad con rutas legacy sin prefijo (/lomaverde, /lucila, /cooperativa)
      if (first === 'lomaverde' || first === 'nodo-lomaverde') {
        localStorage.setItem('elementales_active_node', 'nodo-lomaverde');
        window.location.replace('/?nodo=lomaverde' + (search ? '&' + search.replace(/^\?/, '') : '') + (hash || ''));
      } else if (first === 'lucila' || first === 'nodo-lucila') {
        localStorage.setItem('elementales_active_node', 'nodo-lucila');
        window.location.replace('/?nodo=lucila' + (search ? '&' + search.replace(/^\?/, '') : '') + (hash || ''));
      } else if (first === 'cooperativa' || first === 'chasqui' || first === 'nodo-cooperativa') {
        localStorage.setItem('elementales_active_node', 'nodo-cooperativa');
        window.location.replace('/?nodo=cooperativa' + (search ? '&' + search.replace(/^\?/, '') : '') + (hash || ''));
      } else if (first && !first.includes('.')) {
        // Círculo legacy (ej: /los-robles)
        var queryJoin = search ? '&' + search.replace(/^\?/, '') : '';
        window.location.replace('/?c=' + encodeURIComponent(first) + queryJoin + (hash || ''));
      } else {
        window.location.replace('/' + search + hash);
      }
    })();
  </script>
</head>
<body style="background: #fcfaf8; margin: 0; padding: 0;"></body>
</html>
