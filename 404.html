<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elementales | Red Comunitaria</title>
  <script>
    (function() {
      // Enrutador inteligente instantáneo para GitHub Pages y URLs limpias (/circulo/..., /nodo/..., /lomaverde/tierra/..., etc.)
      var fullPath = (window.location.pathname || '').replace(/^\/+|\/+$/g, '');
      var search = window.location.search || '';
      var hash = window.location.hash || '';

      var parts = fullPath.split('/');
      var first = (parts[0] || '').toLowerCase();
      var second = (parts[1] || '').toLowerCase();
      var third = (parts[2] || '').toLowerCase();
      var queryJoin = search ? '&' + search.replace(/^\?/, '') : '';

      // Rutas para Landings Exclusivas de Gestión, Miembro Elemental y Prosumidores
      if (first === 'gestionelemental' || first === 'gestionelemental.html') {
        window.location.replace('/gestionelemental.html' + (search || '') + (hash || ''));
        return;
      }
      if (first === 'miembroelemental' || first === 'miembroelemental.html') {
        window.location.replace('/miembroelemental.html' + (search || '') + (hash || ''));
        return;
      }
      if (first === 'prosumidores' || first === 'prosumidores.html') {
        window.location.replace('/prosumidores.html' + (search || '') + (hash || ''));
        return;
      }

      // Rutas para Landing Exclusiva de Frutillas (/frutilla, /circulo/{slug}/frutilla, /frutilla/{slug})
      if (first === 'frutilla') {
        var circ = second ? 'circulo=' + encodeURIComponent(second) : '';
        var finalQ = circ ? '?' + circ + (search ? '&' + search.replace(/^\?/, '') : '') : search;
        window.location.replace('/frutilla.html' + finalQ + (hash || ''));
        return;
      }
      if ((first === 'circulo' || first === 'c') && third === 'frutilla') {
        var finalQ = '?circulo=' + encodeURIComponent(second) + (search ? '&' + search.replace(/^\?/, '') : '');
        window.location.replace('/frutilla.html' + finalQ + (hash || ''));
        return;
      }
      if (second === 'frutilla') {
        var finalQ = '?circulo=' + encodeURIComponent(first) + (search ? '&' + search.replace(/^\?/, '') : '');
        window.location.replace('/frutilla.html' + finalQ + (hash || ''));
        return;
      }

      // Rutas de 5 Elementos (/lomaverde/tierra, /lomaverde/tierra/lunar, /lomaverde/agua, etc.)
      var validNodes = ['lomaverde', 'nodo-lomaverde', 'lucila', 'nodo-lucila', 'cooperativa', 'chasqui'];
      var validElements = ['tierra', 'agua', 'fuego', 'aire', 'eter'];

      if (validNodes.indexOf(first) !== -1 && validElements.indexOf(second) !== -1) {
        var normalizedMode = (third === 'luanar' || third === 'lunar') ? 'lunar' : third;
        var modoParam = normalizedMode ? '&modo=' + encodeURIComponent(normalizedMode) : '';
        localStorage.setItem('elementales_active_node', first.indexOf('nodo-') === 0 ? first : 'nodo-' + first);
        window.location.replace('/?nodo=' + encodeURIComponent(first) + '&view=' + encodeURIComponent(second) + modoParam + queryJoin + (hash || ''));
        return;
      }

      if (validElements.indexOf(first) !== -1) {
        var normalizedMode = (second === 'luanar' || second === 'lunar') ? 'lunar' : second;
        var modoParam = normalizedMode ? '&modo=' + encodeURIComponent(normalizedMode) : '';
        localStorage.setItem('elementales_active_node', 'nodo-lomaverde');
        window.location.replace('/?nodo=lomaverde&view=' + encodeURIComponent(first) + modoParam + queryJoin + (hash || ''));
        return;
      }

      // Rutas con prefijo /nodo/{slug}
      if (first === 'nodo') {
        localStorage.setItem('elementales_active_node', 'nodo-lomaverde');
        window.location.replace('/?nodo=lomaverde' + queryJoin + (hash || ''));
        return;
      }

      // Rutas con prefijo /circulo/{slug}
      if (first === 'circulo' && second) {
        window.location.replace('/?c=' + encodeURIComponent(second) + queryJoin + (hash || ''));
        return;
      }

      // Rutas con prefijo /cajon/{slug}
      if (first === 'cajon' && second) {
        localStorage.setItem('elementales_active_node', 'nodo-lomaverde');
        window.location.replace('/?cajon=' + encodeURIComponent(second) + queryJoin + (hash || ''));
        return;
      }

      // Rutas con prefijo /compartido/{shareId}
      if (first === 'compartido' && second) {
        localStorage.setItem('elementales_active_node', 'nodo-lomaverde');
        window.location.replace('/?share=' + encodeURIComponent(second) + queryJoin + (hash || ''));
        return;
      }

      // Compatibilidad con rutas directas (/lomaverde, etc.)
      if (first === 'lomaverde' || first === 'nodo-lomaverde' || first === 'cooperativa' || first === 'lucila') {
        localStorage.setItem('elementales_active_node', 'nodo-lomaverde');
        window.location.replace('/?nodo=lomaverde' + (search ? '&' + search.replace(/^\?/, '') : '') + (hash || ''));
        return;
      } else if (first && first.indexOf('.') === -1) {
        // Círculo directo (ej: /los-robles)
        window.location.replace('/?c=' + encodeURIComponent(first) + queryJoin + (hash || ''));
        return;
      } else {
        window.location.replace('/' + search + hash);
      }
    })();
  </script>
</head>
<body style="background: #fcfaf8; margin: 0; padding: 0;"></body>
</html>
