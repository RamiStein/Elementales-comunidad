<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elementales | Red Comunitaria</title>
  <script>
    // Enrutador inteligente para GitHub Pages y URLs limpias (/lomaverde, /lucila, /los-robles, etc.)
    var fullPath = (window.location.pathname || '').replace(/^\/+|\/+$/g, '');
    var search = window.location.search || '';
    var hash = window.location.hash || '';

    // Tomar el segmento principal de la ruta
    var segment = fullPath.split('/')[0].toLowerCase();

    if (segment === 'lomaverde' || segment === 'nodo-lomaverde') {
      localStorage.setItem('elementales_active_node', 'nodo-lomaverde');
      window.location.replace('/?nodo=lomaverde' + (hash || ''));
    } else if (segment === 'lucila' || segment === 'nodo-lucila') {
      localStorage.setItem('elementales_active_node', 'nodo-lucila');
      window.location.replace('/?nodo=lucila' + (hash || ''));
    } else if (segment === 'cooperativa' || segment === 'chasqui' || segment === 'nodo-cooperativa') {
      localStorage.setItem('elementales_active_node', 'nodo-cooperativa');
      window.location.replace('/?nodo=cooperativa' + (hash || ''));
    } else if (segment && !segment.includes('.')) {
      // Es un Círculo comunitario (ej: /los-robles, /biohuerta, /mibarrio)
      var queryJoin = search ? '&' + search.replace(/^\?/, '') : '';
      window.location.replace('/?c=' + encodeURIComponent(segment) + queryJoin + (hash || ''));
    } else {
      window.location.replace('/' + search + hash);
    }
  </script>
</head>
<body style="font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #fdfaf8; color: #1c1917; text-align: center;">
  <div>
    <p style="font-size: 1.125rem; font-weight: 700; color: #57534e;">Ingresando a Elementales...</p>
    <a href="/" style="font-size: 0.875rem; color: #047857; font-weight: 600;">Hacé clic acá si no redirige</a>
  </div>
</body>
</html>
